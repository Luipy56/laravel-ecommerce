# Staging CI/CD: runs on every push to branch `autoagents`.
# - Tests + frontend build (same gate as production).
# - Deploys to /srv/serra/stage via Docker when STAGE_DEPLOY_ENABLED=true.

name: Stage CI/CD

on:
  push:
    branches: [autoagents]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, fileinfo, sqlite
          coverage: none

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer deps
        run: composer install --no-progress --prefer-dist

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: composer test

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ vars.STAGE_DEPLOY_ENABLED == 'true' }}
    environment: staging
    steps:
      - name: Deploy via SSH (Docker stack)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            DEPLOY_ROOT="${{ secrets.STAGE_PATH }}"
            if [ -z "$DEPLOY_ROOT" ]; then
              DEPLOY_ROOT="/srv/serra/stage"
            fi
            cd "$DEPLOY_ROOT"
            git -C source fetch origin autoagents
            git -C source reset --hard origin/autoagents
            docker compose -f docker-compose.stage.yml build
            docker compose -f docker-compose.stage.yml up -d
            docker compose -f docker-compose.stage.yml exec -T app php artisan db:sync-postgres-sequences
            docker compose -f docker-compose.stage.yml exec -T app php artisan db:reconcile-key-color-schema
            docker compose -f docker-compose.stage.yml exec -T app php artisan migrate --force --no-interaction
            echo "Stage deploy done."
