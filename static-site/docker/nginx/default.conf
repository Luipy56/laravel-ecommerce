server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 16m;

    # Deny VCS / env
    location ~ /\. {
        deny all;
    }

    # Canonical: client asked for top-level *.php → public /web/{slug} (no .php).
    # Internal try_files to *.php keeps $request_uri without .php, so no redirect loop.
    # ProxyPreserveHost on the edge supplies the public host.
    if ($request_uri ~* "^/index\.php(\?|$)") {
        return 301 https://$host/web/$is_args$args;
    }
    if ($request_uri ~* "^/([A-Za-z0-9_-]+)\.php(\?|$)") {
        return 301 https://$host/web/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ $uri.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
