# Development-only: mounted by docker-compose.yml as default.conf.
# Proxies Vite HTTP (/@…, /resources/, /node_modules/) → node:5173.
# HMR WebSocket goes straight to the host-published Vite port (see vite.config.js), not through nginx.

upstream vite_dev {
    server node:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;

    charset utf-8;

    client_max_body_size 64M;

    location ^~ /@ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
    }

    location ^~ /resources/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
    }

    location ^~ /node_modules/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
    }

    # GSC: only when the client literally requested /index.php (not try_files internal).
    # Dev may be plain http on localhost — keep relative redirects here.
    if ($request_uri ~ "^/index\.php(?:\?|$)") {
        return 301 /$is_args$args;
    }

    # Legacy apex marketing *.php (pre-/web cutover) → canonical /web/{slug}.
    if ($request_uri ~ "^/(avislegal|blog|blog-mestrejaments|blog-parts-d-un-pany|blog-tipus-de-claus|contacte|cookies|modal|nosaltres|privacitat|serveis|solidaritat|webs)\.php(?:\?|$)") {
        return 301 /web/$1$is_args$args;
    }
    if ($request_uri ~ "^/qui-som\.php(?:\?|$)") {
        return 301 /web/nosaltres$is_args$args;
    }

    location = /games {
        try_files /index.php?$query_string =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
